<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Campus Customs spokesman in a navy Yale hoodie">
  <defs>
    <radialGradient id="s1bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#cfe3ff"/><stop offset="100%" stop-color="#a9c7ff"/>
    </radialGradient>
    <linearGradient id="s1hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3f7a"/><stop offset="100%" stop-color="#00254a"/>
    </linearGradient>
    <linearGradient id="s1skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1c9a5"/><stop offset="100%" stop-color="#e0ac84"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="28" fill="url(#s1bg)"/>
  <ellipse cx="200" cy="356" rx="150" ry="26" fill="#00356b" opacity="0.18"/>
  <!-- hoodie body -->
  <path d="M90 400 C96 300 128 268 200 268 C272 268 304 300 310 400 Z" fill="url(#s1hood)"/>
  <path d="M176 272 q24 34 48 0 l-6 70 h-36 Z" fill="#00254a"/>
  <rect x="150" y="300" width="100" height="16" rx="8" fill="#0a3f7a"/>
  <text x="200" y="356" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="3">YALE</text>
  <!-- neck + head -->
  <rect x="182" y="222" width="36" height="46" rx="16" fill="url(#s1skin)"/>
  <ellipse cx="200" cy="176" rx="62" ry="68" fill="url(#s1skin)"/>
  <!-- hood up around head -->
  <path d="M132 196 C120 110 150 70 200 70 C250 70 280 110 268 196 C250 150 150 150 132 196 Z" fill="url(#s1hood)"/>
  <!-- hair -->
  <path d="M146 150 C150 104 250 104 254 150 C250 128 234 120 200 120 C166 120 150 128 146 150 Z" fill="#3a2a1d"/>
  <!-- face features: dramatic raised brow -->
  <path d="M158 160 q18 -12 36 -2" stroke="#3a2a1d" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M208 156 q16 -14 34 0" stroke="#3a2a1d" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="176" cy="178" r="6" fill="#2a2320"/>
  <circle cx="226" cy="176" r="6" fill="#2a2320"/>
  <path d="M186 206 q14 10 28 0" stroke="#9c5a3c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M196 182 l-6 16 h14 Z" fill="#cf9b74"/>
  <!-- stubble -->
  <path d="M158 196 C170 230 230 230 242 196 C236 220 164 220 158 196 Z" fill="#3a2a1d" opacity="0.28"/>
