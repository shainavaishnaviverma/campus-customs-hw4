<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cute animated Yale bulldog puppy in a sweater">
  <defs>
    <radialGradient id="a2bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#efe6ff"/><stop offset="100%" stop-color="#cfbcff"/>
    </radialGradient>
    <linearGradient id="a2fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbe5cf"/><stop offset="100%" stop-color="#e7c69e"/>
    </linearGradient>
    <linearGradient id="a2sw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3f7a"/><stop offset="100%" stop-color="#00254a"/>
    </linearGradient>
    <style>
      @keyframes head2 { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
      @keyframes blink2 { 0%,88%,100%{transform:scaleY(1)} 94%{transform:scaleY(.08)} }
      @keyframes earL2 { 0%,100%{transform:rotate(-18deg)} 50%{transform:rotate(-30deg)} }
      @keyframes earR2 { 0%,100%{transform:rotate(18deg)} 50%{transform:rotate(30deg)} }
      #head2 { animation: head2 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center 86%; }
      #eyes2 { animation: blink2 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      #earL2 { animation: earL2 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 88% 12%; }
      #earR2 { animation: earR2 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 12% 12%; }
    </style>
  </defs>
  <rect width="320" height="320" rx="30" fill="url(#a2bg)"/>
  <ellipse cx="160" cy="298" rx="92" ry="14" fill="#6a4fa0" opacity="0.2"/>
  <path d="M104 300 C100 232 124 212 160 212 C196 212 220 232 216 300 Z" fill="url(#a2sw)"/>
  <rect x="112" y="280" width="96" height="12" fill="#15528f"/>
  <text x="160" y="266" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" fill="#fff" letter-spacing="2">YALE</text>
  <ellipse cx="130" cy="300" rx="17" ry="12" fill="#eccba3"/>
  <ellipse cx="190" cy="300" rx="17" ry="12" fill="#eccba3"/>
  <g id="head2">
    <ellipse id="earL2" cx="92" cy="128" rx="26" ry="40" fill="#d6ad80"/>
    <ellipse id="earR2" cx="228" cy="128" rx="26" ry="40" fill="#d6ad80"/>
    <circle cx="160" cy="138" r="84" fill="url(#a2fur)"/>
    <circle cx="110" cy="164" r="15" fill="#ffc2cf" opacity="0.8"/>
    <circle cx="210" cy="164" r="15" fill="#ffc2cf" opacity="0.8"/>
    <g id="eyes2">
      <circle cx="130" cy="132" r="21" fill="#fff"/>
      <circle cx="190" cy="132" r="21" fill="#fff"/>
      <circle cx="133" cy="135" r="13" fill="#3a2a22"/>
      <circle cx="187" cy="135" r="13" fill="#3a2a22"/>
      <circle cx="138" cy="130" r="5" fill="#fff"/>
      <circle cx="192" cy="130" r="5" fill="#fff"/>
    </g>
    <ellipse cx="160" cy="174" rx="35" ry="27" fill="#fff7ee"/>
    <ellipse cx="160" cy="167" rx="12" ry="9" fill="#5b4038"/>
    <path d="M160 176 v8 M160 184 q-13 10 -24 2 M160 184 q13 10 24 2" stroke="#9c7b64" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M151 188 q9 14 18 0 Z" fill="#ff93a8"/>
  </g>
</svg>
