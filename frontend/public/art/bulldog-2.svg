<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Handsome animated Yale bulldog in a sweater">
  <defs>
    <radialGradient id="h2bg" cx="50%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#efe6ff"/><stop offset="100%" stop-color="#cfbcff"/>
    </radialGradient>
    <radialGradient id="h2fur" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#fbe8d3"/><stop offset="100%" stop-color="#dcb88c"/>
    </radialGradient>
    <linearGradient id="h2sw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3f7a"/><stop offset="100%" stop-color="#00254a"/>
    </linearGradient>
    <style>
      @keyframes bob2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @keyframes blink2 { 0%,88%,100%{transform:scaleY(1)} 94%{transform:scaleY(.1)} }
      @keyframes earL2 { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-8deg)} }
      @keyframes earR2 { 0%,100%{transform:rotate(0)} 50%{transform:rotate(8deg)} }
      #dog2 { animation: bob2 2.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      #eyes2 { animation: blink2 3.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      #earL2 { animation: earL2 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 85% 90%; }
      #earR2 { animation: earR2 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 15% 90%; }
    </style>
  </defs>
  <rect width="320" height="320" rx="30" fill="url(#h2bg)"/>
  <ellipse cx="160" cy="302" rx="94" ry="13" fill="#6a4fa0" opacity="0.2"/>
  <!-- sweater -->
  <path d="M104 304 C100 244 126 226 160 226 C194 226 220 244 216 304 Z" fill="url(#h2sw)"/>
  <rect x="112" y="288" width="96" height="12" fill="#15528f"/>
  <text x="160" y="276" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" fill="#fff" letter-spacing="2">YALE</text>
  <ellipse cx="128" cy="304" rx="16" ry="10" fill="#dcb88c"/>
  <ellipse cx="192" cy="304" rx="16" ry="10" fill="#dcb88c"/>
  <g id="dog2">
    <path id="earL2" d="M74 100 q-26 -14 -40 10 q18 20 44 8 Z" fill="#cda076"/>
    <path id="earR2" d="M246 100 q26 -14 40 10 q-18 20 -44 8 Z" fill="#cda076"/>
    <path d="M60 130 Q60 106 82 102 L118 96 Q160 90 202 96 L238 102 Q260 106 260 130
             Q266 154 256 178 Q248 210 196 228 Q160 238 124 228 Q72 210 64 178
             Q54 154 60 130 Z" fill="url(#h2fur)"/>
    <path d="M132 108 q28 -14 56 0" stroke="#c19a6c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M122 122 q38 -18 76 0" stroke="#c19a6c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M98 138 q26 -16 50 -4" stroke="#a9794b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M172 134 q26 -14 50 4" stroke="#a9794b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="92" cy="178" r="15" fill="#ffc2cf" opacity="0.5"/>
    <circle cx="228" cy="178" r="15" fill="#ffc2cf" opacity="0.5"/>
    <g id="eyes2">
      <circle cx="118" cy="156" r="21" fill="#fff"/>
      <circle cx="202" cy="156" r="21" fill="#fff"/>
      <circle cx="121" cy="158" r="13" fill="#44301f"/>
      <circle cx="199" cy="158" r="13" fill="#44301f"/>
      <circle cx="126" cy="154" r="5.5" fill="#fff"/>
      <circle cx="204" cy="154" r="5.5" fill="#fff"/>
    </g>
    <ellipse cx="160" cy="192" rx="54" ry="34" fill="#fff8f0"/>
    <ellipse cx="160" cy="180" rx="20" ry="13" fill="#4a332a"/>
    <ellipse cx="153" cy="176" rx="5" ry="3.5" fill="#7a5a4f"/>
    <path d="M160 193 v7" stroke="#9c7b64" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M122 202 q38 30 76 0 q-10 26 -38 26 q-28 0 -38 -26 Z" fill="#f3ddbf"/>
    <rect x="147" y="199" width="9" height="12" rx="2.5" fill="#fff"/>
    <rect x="164" y="199" width="9" height="12" rx="2.5" fill="#fff"/>
  </g>
</svg>
