<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cute animated Yale bulldog in a sweater">
  <defs>
    <radialGradient id="a2bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#efe6ff"/><stop offset="100%" stop-color="#cfbcff"/>
    </radialGradient>
    <linearGradient id="a2fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbe7d1"/><stop offset="100%" stop-color="#e4c197"/>
    </linearGradient>
    <linearGradient id="a2sw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3f7a"/><stop offset="100%" stop-color="#00254a"/>
    </linearGradient>
    <style>
      @keyframes bob2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @keyframes blink2 { 0%,88%,100%{transform:scaleY(1)} 94%{transform:scaleY(.08)} }
      @keyframes earL2 { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-12deg)} }
      @keyframes earR2 { 0%,100%{transform:rotate(0)} 50%{transform:rotate(12deg)} }
      #dog2 { animation: bob2 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      #eyes2 { animation: blink2 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      #earL2 { animation: earL2 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 90%; }
      #earR2 { animation: earR2 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 20% 90%; }
    </style>
  </defs>
  <rect width="320" height="320" rx="30" fill="url(#a2bg)"/>
  <ellipse cx="160" cy="300" rx="96" ry="13" fill="#6a4fa0" opacity="0.2"/>
  <!-- sweater body -->
  <path d="M100 302 C96 236 122 216 160 216 C198 216 224 236 220 302 Z" fill="url(#a2sw)"/>
  <rect x="108" y="284" width="104" height="12" fill="#15528f"/>
  <text x="160" y="268" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="900" fill="#fff" letter-spacing="2">YALE</text>
  <ellipse cx="126" cy="302" rx="17" ry="11" fill="#e4c197"/>
  <ellipse cx="194" cy="302" rx="17" ry="11" fill="#e4c197"/>
  <g id="dog2">
    <path id="earL2" d="M84 86 q-32 -6 -38 24 q24 10 44 -6 Z" fill="#cda373"/>
    <path id="earR2" d="M236 86 q32 -6 38 24 q-24 10 -44 -6 Z" fill="#cda373"/>
    <ellipse cx="160" cy="140" rx="94" ry="80" fill="url(#a2fur)"/>
    <path d="M140 112 q20 -15 40 0" stroke="#c9a373" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M147 100 q13 -9 26 0" stroke="#c9a373" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="164" r="16" fill="#ffc2cf" opacity="0.8"/>
    <circle cx="220" cy="164" r="16" fill="#ffc2cf" opacity="0.8"/>
    <g id="eyes2">
      <circle cx="120" cy="136" r="22" fill="#fff"/>
      <circle cx="200" cy="136" r="22" fill="#fff"/>
      <circle cx="124" cy="139" r="14" fill="#3a2a22"/>
      <circle cx="196" cy="139" r="14" fill="#3a2a22"/>
      <circle cx="129" cy="134" r="5.5" fill="#fff"/>
      <circle cx="201" cy="134" r="5.5" fill="#fff"/>
    </g>
    <path d="M108 180 q-6 50 38 54 q-28 -24 -8 -54 Z" fill="#f1dcc0"/>
    <path d="M212 180 q6 50 -38 54 q28 -24 8 -54 Z" fill="#f1dcc0"/>
    <ellipse cx="160" cy="184" rx="60" ry="42" fill="#fff7ee"/>
    <path d="M122 202 q38 36 76 0 q-38 18 -76 0 Z" fill="#f3ddc2"/>
    <rect x="147" y="199" width="8" height="11" rx="2" fill="#fff"/>
    <rect x="165" y="199" width="8" height="11" rx="2" fill="#fff"/>
    <ellipse cx="160" cy="170" rx="20" ry="13" fill="#5b4038"/>
    <ellipse cx="153" cy="166" rx="4.5" ry="3" fill="#8a6a5f"/>
    <path d="M160 183 v9 M160 192 q-16 11 -30 2 M160 192 q16 11 30 2" stroke="#9c7b64" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
