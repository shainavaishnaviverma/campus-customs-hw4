<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cute Yale bulldog puppy in a sweater">
  <defs>
    <radialGradient id="c2bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#efe6ff"/><stop offset="100%" stop-color="#cfbcff"/>
    </radialGradient>
    <linearGradient id="c2fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbe5cf"/><stop offset="100%" stop-color="#e7c69e"/>
    </linearGradient>
    <linearGradient id="c2sw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3f7a"/><stop offset="100%" stop-color="#00254a"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="30" fill="url(#c2bg)"/>
  <ellipse cx="160" cy="298" rx="92" ry="14" fill="#6a4fa0" opacity="0.2"/>
  <!-- cozy sweater body -->
  <path d="M104 300 C100 232 124 212 160 212 C196 212 220 232 216 300 Z" fill="url(#c2sw)"/>
  <rect x="112" y="280" width="96" height="12" fill="#15528f"/>
  <text x="160" y="266" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" fill="#fff" letter-spacing="2">YALE</text>
  <ellipse cx="130" cy="300" rx="17" ry="12" fill="#eccba3"/>
  <ellipse cx="190" cy="300" rx="17" ry="12" fill="#eccba3"/>
  <!-- ears -->
  <ellipse cx="92" cy="128" rx="26" ry="38" fill="#d6ad80" transform="rotate(-18 92 128)"/>
  <ellipse cx="228" cy="128" rx="26" ry="38" fill="#d6ad80" transform="rotate(18 228 128)"/>
  <!-- round head -->
  <circle cx="160" cy="138" r="82" fill="url(#c2fur)"/>
  <!-- rosy cheeks -->
  <circle cx="112" cy="162" r="15" fill="#ffc2cf" opacity="0.75"/>
  <circle cx="208" cy="162" r="15" fill="#ffc2cf" opacity="0.75"/>
  <!-- big eyes -->
  <circle cx="130" cy="132" r="19" fill="#fff"/>
  <circle cx="190" cy="132" r="19" fill="#fff"/>
  <circle cx="133" cy="135" r="12" fill="#3a2a22"/>
  <circle cx="187" cy="135" r="12" fill="#3a2a22"/>
  <circle cx="137" cy="131" r="4.5" fill="#fff"/>
  <circle cx="191" cy="131" r="4.5" fill="#fff"/>
  <!-- muzzle + nose + smile -->
  <ellipse cx="160" cy="172" rx="34" ry="26" fill="#fff7ee"/>
  <ellipse cx="160" cy="166" rx="11" ry="8" fill="#5b4038"/>
  <path d="M160 174 v8 M160 182 q-13 10 -24 2 M160 182 q13 10 24 2" stroke="#9c7b64" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M151 186 q9 14 18 0 Z" fill="#ff93a8"/>
</svg>
