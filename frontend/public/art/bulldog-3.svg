<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cute happy Yale bulldog puppy">
  <defs>
    <radialGradient id="c3bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#ffeede"/><stop offset="100%" stop-color="#ffc7ad"/>
    </radialGradient>
    <linearGradient id="c3fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce7d2"/><stop offset="100%" stop-color="#ebc89f"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="30" fill="url(#c3bg)"/>
  <ellipse cx="160" cy="292" rx="94" ry="15" fill="#c06a40" opacity="0.18"/>
  <g transform="rotate(-6 160 160)">
    <!-- ears -->
    <ellipse cx="82" cy="140" rx="27" ry="40" fill="#d8ac7e" transform="rotate(-20 82 140)"/>
    <ellipse cx="238" cy="140" rx="27" ry="40" fill="#d8ac7e" transform="rotate(20 238 140)"/>
    <!-- round head -->
    <circle cx="160" cy="150" r="88" fill="url(#c3fur)"/>
    <!-- rosy cheeks -->
    <circle cx="106" cy="178" r="17" fill="#ffc2cf" opacity="0.8"/>
    <circle cx="214" cy="178" r="17" fill="#ffc2cf" opacity="0.8"/>
    <!-- happy closed eyes (sparkly curves) -->
    <path d="M110 146 q16 -18 34 0" stroke="#3a2a22" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M176 146 q16 -18 34 0" stroke="#3a2a22" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- sparkles -->
    <circle cx="150" cy="128" r="3" fill="#fff"/><circle cx="208" cy="124" r="2.5" fill="#fff"/>
    <!-- muzzle + nose -->
    <ellipse cx="160" cy="188" rx="40" ry="30" fill="#fff7ee"/>
    <ellipse cx="160" cy="180" rx="13" ry="9" fill="#5b4038"/>
    <!-- big open happy smile + tongue -->
    <path d="M160 188 v8 M132 200 q28 30 56 0" stroke="#9c7b64" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M144 206 q16 26 32 0 Z" fill="#ff93a8"/>
  </g>
  <!-- navy bandana -->
  <path d="M94 240 q66 36 132 0 l-10 22 q-56 28 -112 0 Z" fill="#00356b"/>
</svg>
