<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Handsome animated happy Yale bulldog">
  <defs>
    <radialGradient id="h3bg" cx="50%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#ffeede"/><stop offset="100%" stop-color="#ffc7ad"/>
    </radialGradient>
    <radialGradient id="h3fur" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#fbe8d3"/><stop offset="100%" stop-color="#dcb88c"/>
    </radialGradient>
    <style>
      @keyframes hop3 { 0%,100%{transform:translateY(0) scale(1,1)} 25%{transform:translateY(-9px) scale(.98,1.02)} 55%{transform:translateY(0) scale(1.03,.97)} }
      @keyframes earL3 { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-12deg)} }
      @keyframes earR3 { 0%,100%{transform:rotate(0)} 50%{transform:rotate(12deg)} }
      @keyframes tongue3 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(3px)} }
      @keyframes sparkle3 { 0%,100%{opacity:.2; transform:scale(.6)} 50%{opacity:1; transform:scale(1.2)} }
      #dog3 { animation: hop3 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      #earL3 { animation: earL3 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 85% 90%; }
      #earR3 { animation: earR3 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 15% 90%; }
      #tongue3 { animation: tongue3 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: top; }
      .spark3 { animation: sparkle3 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .spark3.b { animation-delay: .9s; }
    </style>
  </defs>
  <rect width="320" height="320" rx="30" fill="url(#h3bg)"/>
  <ellipse cx="160" cy="300" rx="98" ry="14" fill="#c06a40" opacity="0.18"/>
  <g id="dog3">
    <path id="earL3" d="M74 102 q-26 -14 -40 10 q18 20 44 8 Z" fill="#cda076"/>
    <path id="earR3" d="M246 102 q26 -14 40 10 q-18 20 -44 8 Z" fill="#cda076"/>
    <path d="M60 132 Q60 108 82 104 L118 98 Q160 92 202 98 L238 104 Q260 108 260 132
             Q266 156 256 180 Q248 212 196 230 Q160 240 124 230 Q72 212 64 180
             Q54 156 60 132 Z" fill="url(#h3fur)"/>
    <path d="M132 110 q28 -14 56 0" stroke="#c19a6c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M122 124 q38 -18 76 0" stroke="#c19a6c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M98 140 q26 -16 50 -4" stroke="#a9794b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M172 136 q26 -14 50 4" stroke="#a9794b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="92" cy="180" r="15" fill="#ffc2cf" opacity="0.55"/>
    <circle cx="228" cy="180" r="15" fill="#ffc2cf" opacity="0.55"/>
    <!-- bright happy eyes -->
    <circle cx="118" cy="158" r="21" fill="#fff"/>
    <circle cx="202" cy="158" r="21" fill="#fff"/>
    <circle cx="121" cy="160" r="13" fill="#44301f"/>
    <circle cx="199" cy="160" r="13" fill="#44301f"/>
    <circle cx="126" cy="155" r="5.5" fill="#fff"/>
    <circle cx="204" cy="155" r="5.5" fill="#fff"/>
    <circle class="spark3" cx="150" cy="118" r="3.5" fill="#fff"/>
    <circle class="spark3 b" cx="214" cy="116" r="3" fill="#fff"/>
    <!-- muzzle + nose -->
    <ellipse cx="160" cy="194" rx="54" ry="34" fill="#fff8f0"/>
    <ellipse cx="160" cy="182" rx="20" ry="13" fill="#4a332a"/>
    <ellipse cx="153" cy="178" rx="5" ry="3.5" fill="#7a5a4f"/>
    <!-- happy open underbite grin with little teeth + tongue -->
    <path d="M160 195 v6" stroke="#9c7b64" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M120 204 q40 34 80 0 q-12 30 -40 30 q-28 0 -40 -30 Z" fill="#f3ddbf"/>
    <rect x="147" y="201" width="9" height="12" rx="2.5" fill="#fff"/>
    <rect x="164" y="201" width="9" height="12" rx="2.5" fill="#fff"/>
    <path id="tongue3" d="M148 220 q12 20 24 0 Z" fill="#ff93a8"/>
  </g>
  <path d="M90 244 q70 36 140 0 l-10 20 q-60 28 -120 0 Z" fill="#00356b"/>
</svg>
