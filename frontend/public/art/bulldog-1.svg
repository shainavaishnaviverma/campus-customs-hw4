<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cute Yale bulldog puppy">
  <defs>
    <radialGradient id="c1bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#fff6d6"/><stop offset="100%" stop-color="#ffe29a"/>
    </radialGradient>
    <linearGradient id="c1fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbe4cd"/><stop offset="100%" stop-color="#eccba3"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="30" fill="url(#c1bg)"/>
  <ellipse cx="160" cy="290" rx="96" ry="16" fill="#caa23e" opacity="0.18"/>
  <!-- floppy ears -->
  <ellipse cx="74" cy="150" rx="30" ry="44" fill="#d9b388" transform="rotate(-16 74 150)"/>
  <ellipse cx="246" cy="150" rx="30" ry="44" fill="#d9b388" transform="rotate(16 246 150)"/>
  <!-- round head -->
  <circle cx="160" cy="158" r="94" fill="url(#c1fur)"/>
  <!-- soft forehead marking -->
  <path d="M160 74 q-20 40 0 70 q20 -30 0 -70 Z" fill="#fff3e2" opacity="0.7"/>
  <!-- rosy cheeks -->
  <circle cx="104" cy="186" r="18" fill="#ffc2cf" opacity="0.75"/>
  <circle cx="216" cy="186" r="18" fill="#ffc2cf" opacity="0.75"/>
  <!-- big sparkly eyes -->
  <circle cx="123" cy="150" r="22" fill="#fff"/>
  <circle cx="197" cy="150" r="22" fill="#fff"/>
  <circle cx="126" cy="153" r="14" fill="#3a2a22"/>
  <circle cx="194" cy="153" r="14" fill="#3a2a22"/>
  <circle cx="131" cy="148" r="5" fill="#fff"/>
  <circle cx="199" cy="148" r="5" fill="#fff"/>
  <circle cx="121" cy="159" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="189" cy="159" r="2.5" fill="#fff" opacity="0.8"/>
  <!-- muzzle + tiny nose -->
  <ellipse cx="160" cy="196" rx="40" ry="30" fill="#fff7ee"/>
  <ellipse cx="160" cy="188" rx="13" ry="10" fill="#5b4038"/>
  <ellipse cx="156" cy="185" rx="4" ry="3" fill="#8a6a5f"/>
  <!-- happy smile -->
  <path d="M160 198 v10 M160 208 q-16 12 -30 2 M160 208 q16 12 30 2" stroke="#9c7b64" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- little tongue -->
  <path d="M150 212 q10 16 20 0 Z" fill="#ff93a8"/>
  <!-- navy collar + tag -->
  <path d="M92 232 q68 40 136 0 l-9 20 q-59 30 -118 0 Z" fill="#00356b"/>
  <circle cx="160" cy="252" r="12" fill="#ffd86b" stroke="#00356b" stroke-width="3"/>
  <text x="160" y="257" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="12" font-weight="900" fill="#00356b">Y</text>
</svg>
