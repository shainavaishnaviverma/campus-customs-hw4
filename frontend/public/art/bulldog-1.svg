<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Handsome animated Yale bulldog">
  <defs>
    <radialGradient id="h1bg" cx="50%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#fff6d6"/><stop offset="100%" stop-color="#ffe29a"/>
    </radialGradient>
    <radialGradient id="h1fur" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#fbe8d3"/><stop offset="100%" stop-color="#dcb88c"/>
    </radialGradient>
    <style>
      @keyframes bob1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @keyframes wink1 { 0%,86%,100%{transform:scaleY(1)} 92%{transform:scaleY(.12)} }
      @keyframes earL1 { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-8deg)} }
      @keyframes earR1 { 0%,100%{transform:rotate(0)} 50%{transform:rotate(8deg)} }
      @keyframes tie1 { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }
      #dog1 { animation: bob1 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      #winkR1 { animation: wink1 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      #earL1 { animation: earL1 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 85% 90%; }
      #earR1 { animation: earR1 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 15% 90%; }
      #tie1 { animation: tie1 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    </style>
  </defs>
  <rect width="320" height="320" rx="30" fill="url(#h1bg)"/>
  <ellipse cx="160" cy="300" rx="100" ry="14" fill="#caa23e" opacity="0.18"/>
  <g id="dog1">
    <!-- neat rose ears at the squared corners -->
    <path id="earL1" d="M74 104 q-26 -14 -40 10 q18 20 44 8 Z" fill="#cda076"/>
    <path id="earR1" d="M246 104 q26 -14 40 10 q-18 20 -44 8 Z" fill="#cda076"/>
    <!-- broad, blocky bulldog head (wider than tall, flat-ish top, strong jaw) -->
    <path d="M60 134 Q60 110 82 106 L118 100 Q160 94 202 100 L238 106 Q260 110 260 134
             Q266 158 256 182 Q248 214 196 232 Q160 242 124 232 Q72 214 64 182
             Q54 158 60 134 Z" fill="url(#h1fur)"/>
    <!-- signature forehead wrinkles -->
    <path d="M132 112 q28 -14 56 0" stroke="#c19a6c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M122 126 q38 -18 76 0" stroke="#c19a6c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- strong confident brows -->
    <path d="M98 142 q26 -16 50 -4" stroke="#a9794b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M172 138 q26 -14 50 4" stroke="#a9794b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- subtle cheeks -->
    <circle cx="92" cy="182" r="15" fill="#ffc2cf" opacity="0.5"/>
    <circle cx="228" cy="182" r="15" fill="#ffc2cf" opacity="0.5"/>
    <!-- bright eyes, set wide; right winks -->
    <g>
      <circle cx="118" cy="160" r="21" fill="#fff"/>
      <circle cx="121" cy="162" r="13" fill="#44301f"/>
      <circle cx="126" cy="158" r="5.5" fill="#fff"/>
    </g>
    <g id="winkR1">
      <circle cx="202" cy="160" r="21" fill="#fff"/>
      <circle cx="199" cy="162" r="13" fill="#44301f"/>
      <circle cx="204" cy="158" r="5.5" fill="#fff"/>
    </g>
    <!-- wide pushed-in muzzle -->
    <ellipse cx="160" cy="196" rx="54" ry="34" fill="#fff8f0"/>
    <!-- nose + philtrum -->
    <ellipse cx="160" cy="184" rx="20" ry="13" fill="#4a332a"/>
    <ellipse cx="153" cy="180" rx="5" ry="3.5" fill="#7a5a4f"/>
    <path d="M160 197 v7" stroke="#9c7b64" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- protruding lower jaw (underbite) with two little teeth -->
    <path d="M122 206 q38 30 76 0 q-10 26 -38 26 q-28 0 -38 -26 Z" fill="#f3ddbf"/>
    <rect x="147" y="203" width="9" height="12" rx="2.5" fill="#fff"/>
    <rect x="164" y="203" width="9" height="12" rx="2.5" fill="#fff"/>
  </g>
  <!-- dapper navy bow tie -->
  <g id="tie1">
    <path d="M160 252 l-34 -16 v32 Z" fill="#00356b"/>
    <path d="M160 252 l34 -16 v32 Z" fill="#00356b"/>
    <circle cx="160" cy="252" r="9" fill="#ffd86b" stroke="#00356b" stroke-width="2"/>
    <text x="160" y="256" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="10" font-weight="900" fill="#00356b">Y</text>
  </g>
</svg>
