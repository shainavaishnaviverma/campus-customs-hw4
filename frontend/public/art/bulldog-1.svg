<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cute animated Yale bulldog puppy">
  <defs>
    <radialGradient id="a1bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#fff6d6"/><stop offset="100%" stop-color="#ffe29a"/>
    </radialGradient>
    <linearGradient id="a1fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbe4cd"/><stop offset="100%" stop-color="#eccba3"/>
    </linearGradient>
    <style>
      @keyframes bob1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
      @keyframes blink1 { 0%,90%,100%{transform:scaleY(1)} 95%{transform:scaleY(.08)} }
      @keyframes earL1 { 0%,100%{transform:rotate(-15deg)} 50%{transform:rotate(-27deg)} }
      @keyframes earR1 { 0%,100%{transform:rotate(15deg)} 50%{transform:rotate(27deg)} }
      @keyframes tongue1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(3px)} }
      #dog1 { animation: bob1 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      #eyes1 { animation: blink1 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      #earL1 { animation: earL1 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 90% 10%; }
      #earR1 { animation: earR1 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 10% 10%; }
      #tongue1 { animation: tongue1 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: top; }
    </style>
  </defs>
  <rect width="320" height="320" rx="30" fill="url(#a1bg)"/>
  <ellipse cx="160" cy="292" rx="96" ry="15" fill="#caa23e" opacity="0.18"/>
  <g id="dog1">
    <ellipse id="earL1" cx="74" cy="150" rx="30" ry="46" fill="#d9b388"/>
    <ellipse id="earR1" cx="246" cy="150" rx="30" ry="46" fill="#d9b388"/>
    <circle cx="160" cy="158" r="96" fill="url(#a1fur)"/>
    <path d="M160 72 q-18 40 0 70 q18 -30 0 -70 Z" fill="#fff3e2" opacity="0.7"/>
    <circle cx="102" cy="188" r="18" fill="#ffc2cf" opacity="0.8"/>
    <circle cx="218" cy="188" r="18" fill="#ffc2cf" opacity="0.8"/>
    <g id="eyes1">
      <circle cx="122" cy="150" r="25" fill="#fff"/>
      <circle cx="198" cy="150" r="25" fill="#fff"/>
      <circle cx="126" cy="153" r="16" fill="#3a2a22"/>
      <circle cx="194" cy="153" r="16" fill="#3a2a22"/>
      <circle cx="132" cy="147" r="6" fill="#fff"/>
      <circle cx="200" cy="147" r="6" fill="#fff"/>
      <circle cx="120" cy="160" r="3" fill="#fff" opacity="0.85"/>
      <circle cx="188" cy="160" r="3" fill="#fff" opacity="0.85"/>
    </g>
    <ellipse cx="160" cy="198" rx="42" ry="31" fill="#fff7ee"/>
    <ellipse cx="160" cy="189" rx="14" ry="10" fill="#5b4038"/>
    <ellipse cx="155" cy="186" rx="4" ry="3" fill="#8a6a5f"/>
    <path d="M160 199 v10 M160 209 q-16 12 -30 2 M160 209 q16 12 30 2" stroke="#9c7b64" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path id="tongue1" d="M150 213 q10 17 20 0 Z" fill="#ff93a8"/>
  </g>
  <path d="M92 234 q68 40 136 0 l-9 20 q-59 30 -118 0 Z" fill="#00356b"/>
  <circle cx="160" cy="254" r="12" fill="#ffd86b" stroke="#00356b" stroke-width="3"/>
  <text x="160" y="259" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="12" font-weight="900" fill="#00356b">Y</text>
</svg>
