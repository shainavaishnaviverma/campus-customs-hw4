<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cute animated Yale bulldog">
  <defs>
    <radialGradient id="a1bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#fff6d6"/><stop offset="100%" stop-color="#ffe29a"/>
    </radialGradient>
    <linearGradient id="a1fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbe7d1"/><stop offset="100%" stop-color="#e4c197"/>
    </linearGradient>
    <style>
      @keyframes bob1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
      @keyframes blink1 { 0%,90%,100%{transform:scaleY(1)} 95%{transform:scaleY(.08)} }
      @keyframes earL1 { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-12deg)} }
      @keyframes earR1 { 0%,100%{transform:rotate(0)} 50%{transform:rotate(12deg)} }
      #dog1 { animation: bob1 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      #eyes1 { animation: blink1 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      #earL1 { animation: earL1 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 90%; }
      #earR1 { animation: earR1 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 20% 90%; }
    </style>
  </defs>
  <rect width="320" height="320" rx="30" fill="url(#a1bg)"/>
  <ellipse cx="160" cy="296" rx="100" ry="15" fill="#caa23e" opacity="0.18"/>
  <g id="dog1">
    <!-- small rose ears, folded, set wide -->
    <path id="earL1" d="M78 96 q-34 -6 -40 26 q26 10 48 -6 Z" fill="#cda373"/>
    <path id="earR1" d="M242 96 q34 -6 40 26 q-26 10 -48 -6 Z" fill="#cda373"/>
    <!-- wide bulldog head -->
    <ellipse cx="160" cy="150" rx="102" ry="88" fill="url(#a1fur)"/>
    <!-- brow wrinkles between the eyes -->
    <path d="M138 118 q22 -16 44 0" stroke="#c9a373" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M146 106 q14 -10 28 0" stroke="#c9a373" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- rosy cheeks -->
    <circle cx="96" cy="176" r="18" fill="#ffc2cf" opacity="0.8"/>
    <circle cx="224" cy="176" r="18" fill="#ffc2cf" opacity="0.8"/>
    <!-- big eyes, set wide -->
    <g id="eyes1">
      <circle cx="116" cy="144" r="24" fill="#fff"/>
      <circle cx="204" cy="144" r="24" fill="#fff"/>
      <circle cx="120" cy="147" r="15" fill="#3a2a22"/>
      <circle cx="200" cy="147" r="15" fill="#3a2a22"/>
      <circle cx="126" cy="142" r="6" fill="#fff"/>
      <circle cx="206" cy="142" r="6" fill="#fff"/>
    </g>
    <!-- droopy jowls -->
    <path d="M104 188 q-6 56 40 60 q-30 -26 -8 -60 Z" fill="#f1dcc0"/>
    <path d="M216 188 q6 56 -40 60 q30 -26 8 -60 Z" fill="#f1dcc0"/>
    <!-- wide flat muzzle -->
    <ellipse cx="160" cy="194" rx="66" ry="46" fill="#fff7ee"/>
    <!-- underbite: lower lip with two little teeth -->
    <path d="M118 214 q42 40 84 0 q-42 20 -84 0 Z" fill="#f3ddc2"/>
    <rect x="146" y="210" width="9" height="12" rx="2" fill="#fff"/>
    <rect x="165" y="210" width="9" height="12" rx="2" fill="#fff"/>
    <!-- big nose + philtrum + mouth -->
    <ellipse cx="160" cy="178" rx="22" ry="14" fill="#5b4038"/>
    <ellipse cx="152" cy="174" rx="5" ry="3.5" fill="#8a6a5f"/>
    <path d="M160 192 v10 M160 202 q-18 12 -34 2 M160 202 q18 12 34 2" stroke="#9c7b64" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- navy collar + Y tag -->
  <path d="M88 236 q72 42 144 0 l-10 20 q-62 30 -124 0 Z" fill="#00356b"/>
  <circle cx="160" cy="256" r="12" fill="#ffd86b" stroke="#00356b" stroke-width="3"/>
  <text x="160" y="261" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="12" font-weight="900" fill="#00356b">Y</text>
</svg>
